services:
  - type: web
    name: rvscet-placement-backend
    runtime: node
    region: singapore          # closest to India
    plan: free
    rootDir: .                 # render runs from this folder
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # Render assigns this automatically; keep as fallback
      - key: MONGO_URI
        sync: false             # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true     # Render auto-generates a secure secret
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_COOKIE_EXPIRE
        value: 7
      - key: CLIENT_URL
        sync: false             # set to your Vercel URL after deploy
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false             # set manually — your Gmail address
      - key: SMTP_PASSWORD
        sync: false             # set manually — your Gmail App Password
      - key: MAIL_FROM
        sync: false             # e.g. "RVSCET Portal <noreply@rvscet.ac.in>"
